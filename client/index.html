<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LiveRecall Student Client</title>
  <link rel="stylesheet" href="index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Inter",system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    #status { font-weight: 700; }
    .naive-line { padding: .25rem 0; border-bottom: 1px dotted #ddd; }
    button { padding: .55rem .75rem; margin: .2rem; }
    #recall { white-space: pre-wrap; margin-top: 1rem; border-left: 3px solid #ccc; padding-left: 1rem; }
    .hint { font-size: .9rem; color: #555; }
  </style>
</head>
<body>
  <h1>LiveRecall</h1>
  <p>Connection: <span id="status">disconnected</span></p>
  <div id="live"></div>
  <div>
    <button class="btn" data-seconds="30">What did I miss? (30 s)</button>
    <button class="btn" data-seconds="15">15 s</button>
    <button class="btn" data-seconds="60">60 s</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
